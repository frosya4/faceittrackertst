<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faceit Stats Overlay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: transparent;
            padding: 20px;
        }

        .overlay-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: fit-content;
        }

        /* Верхняя панель - ELO и KDR */
        .top-panel {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1a1a1a;
            border-radius: 25px;
            padding: 12px 25px;
            min-width: 400px;
        }

        .elo-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        :root {
            --level-color: #ff5500;
        }

        .level-badge {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: conic-gradient(var(--level-color) 0deg, var(--level-color) var(--level-percent), #333 var(--level-percent), #333 360deg);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.3s ease;
        }

        .level-badge::before {
            content: attr(data-level);
            font-size: 18px;
            font-weight: bold;
            color: var(--level-color);
            background: #1a1a1a;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Специальный стиль для 10 лвла - как на скриншоте пользователя */
        .level-badge[data-level="10"] {
            background: transparent;
            border: 4px solid var(--level-color);
            box-shadow: 0 0 10px rgba(255, 85, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .level-badge[data-level="10"]::before {
            background: transparent;
            color: var(--level-color);
            font-size: 20px;
            width: auto;
            height: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: -3px;
            /* Сдвигаем еще выше */
        }

        .elo-value {
            font-size: 32px;
            font-weight: bold;
            color: #fff;
        }

        .separator {
            color: #666;
            font-size: 24px;
            margin: 0 10px;
        }

        .kdr-section {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .kdr-value {
            font-size: 28px;
            font-weight: bold;
            color: #fff;
        }

        .kdr-label {
            font-size: 20px;
            color: #aaa;
            font-weight: 600;
        }

        /* Нижняя панель - статистика */
        .bottom-panel {
            background: #1a1a1a;
            border-radius: 15px;
            padding: 12px 20px;
            min-width: 400px;
        }

        .matches-header {
            text-align: center;
            font-size: 10px;
            color: #555;
            font-weight: 700;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .stat-value {
            font-size: 26px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.5px;
        }

        .stat-label {
            font-size: 9px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .stat-group.middle {
            position: relative;
        }

        .stat-group.middle::before,
        .stat-group.middle::after {
            content: '';
            position: absolute;
            background: #333;
            width: 1px;
            height: 30px;
            top: 50%;
            transform: translateY(-50%);
        }

        .stat-group.middle::before {
            left: -35px;
        }

        .stat-group.middle::after {
            right: -35px;
        }

        .stat-main-row {
            display: flex;
            align-items: baseline;
            gap: 5px;
        }

        .stat-sublabel {
            font-size: 18px;
            color: #888;
            font-weight: 700;
        }

        /* Сессия и история игр */
        .session-row {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #222;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .session-score {
            font-size: 11px;
            color: #707070;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .history-dots {
            display: flex;
            gap: 6px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #333;
            transition: all 0.3s ease;
        }

        .dot.win {
            background: #4ade80;
            /* Зеленый */
            box-shadow: 0 0 8px rgba(74, 222, 128, 0.4);
        }

        .dot.loss {
            background: #f87171;
            /* Красный */
            box-shadow: 0 0 8px rgba(248, 113, 113, 0.4);
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }
        }

        .updating {
            animation: pulse 1s ease-in-out infinite;
        }

        .error-state {
            color: #ff4444 !important;
        }

        /* Настройки позиции */
        .overlay-wrapper {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }
    </style>
</head>

<body>
    <div class="overlay-wrapper">
        <div class="overlay-container" id="overlay">
            <!-- Верхняя панель -->
            <div class="top-panel">
                <div class="elo-section">
                    <div class="level-badge" data-level="10" style="--level-percent: 100%"></div>
                    <span class="elo-value" id="elo">Загрузка...</span>
                </div>
                <span class="separator">|</span>
                <div class="kdr-section">
                    <span class="kdr-value" id="kd-ratio">--</span>
                    <span class="kdr-label">K/D</span>
                </div>
            </div>

            <!-- Нижняя панель -->
            <div class="bottom-panel">
                <div class="matches-header">LAST 20 MATCHES</div>
                <div class="stats-row">
                    <div class="stat-group">
                        <span class="stat-value" id="winrate">--%</span>
                        <span class="stat-label">Win rate</span>
                    </div>
                    <div class="stat-group middle">
                        <div class="stat-main-row">
                            <span class="stat-value" id="avg-kills">--</span>
                            <span class="stat-sublabel" id="hs-percent">/ --%</span>
                        </div>
                        <span class="stat-label">Avg. kills / HS</span>
                    </div>
                    <div class="stat-group">
                        <div class="stat-main-row">
                            <span class="stat-value" id="kdr">--</span>
                            <span class="stat-sublabel" id="kr-ratio">/ --</span>
                        </div>
                        <span class="stat-label">Overall KDR / K/R</span>
                    </div>
                </div>

                <!-- Сессия и история игр -->
                <div class="session-row">
                    <div class="session-score" id="session-score">SESSION: 0W - 0L</div>
                    <div class="history-dots" id="history-dots">
                        <!-- Кружки W/L появятся тут -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Конфигурация
        const params = new URLSearchParams(window.location.search);
        const playerNickname = params.get('n') || params.get('nickname') || 'DeRoyse';

        const CONFIG = {
            apiUrl: window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
                ? 'http://localhost:3000/api/stats'
                : '/api/stats',
            // Ставим 30 секунд для более бодрого обновления
            updateInterval: 30
        };

        // Глобальное состояние сессии
        let lastMatchId = null;
        let sessionWins = 0;
        let sessionLosses = 0;

        // Обновление данных
        async function updateStats() {
            const overlay = document.getElementById('overlay');
            overlay.classList.add('updating');

            try {
                // Добавляем nickname и timestamp для обхода кеша
                const cacheBuster = `?n=${encodeURIComponent(playerNickname)}&t=${Date.now()}`;
                const response = await fetch(CONFIG.apiUrl + cacheBuster);

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error || `HTTP ${response.status}`);
                }

                const data = await response.json();

                if (data.error && !data.elo) throw new Error(data.error);

                // Если никнейм на сервере отличается от запрошенного (например, ошибка поиска), уведомляем
                if (data.nickname && data.nickname.toLowerCase() !== playerNickname.toLowerCase()) {
                    console.warn(`Requested ${playerNickname}, but got ${data.nickname}`);
                }

                // Обновление ELO и уровня
                document.getElementById('elo').textContent = Math.round(data.elo) || 0;
                const levelBadge = document.querySelector('.level-badge');
                levelBadge.setAttribute('data-level', data.level || 1);
                const percent = (data.level || 1) === 10 ? 100 : (data.level / 10) * 100;
                levelBadge.style.setProperty('--level-percent', `${percent}%`);

                // Обновление статистики
                document.getElementById('kd-ratio').textContent = (data.kdRatio || 0).toFixed(2);
                document.getElementById('winrate').textContent = `${data.winrate || 0}%`;
                document.getElementById('avg-kills').textContent = (data.avgKills || 0).toFixed(1);
                document.getElementById('hs-percent').textContent = `/ ${data.hsPercent || 0}%`;
                document.getElementById('kdr').textContent = (data.kdr || 0).toFixed(2);
                document.getElementById('kr-ratio').textContent = `/ ${(data.krRatio || 0).toFixed(2)}`;

                // Отображение сессии из бекенда (за последние 8 часов)
                document.getElementById('session-score').textContent = `SESSION: ${data.sessionWins || 0}W - ${data.sessionLosses || 0}L`;

                // Отрисовка кружков истории
                renderHistoryDots(data.recentResults);

                // Убираем ошибку если была
                document.querySelectorAll('*').forEach(el => el.classList.remove('error-state'));

            } catch (error) {
                console.error('Ошибка:', error);
                document.getElementById('elo').textContent = 'Ошибка';
                document.getElementById('elo').classList.add('error-state');
            } finally {
                setTimeout(() => overlay.classList.remove('updating'), 500);
            }
        }

        function renderHistoryDots(results) {
            const container = document.getElementById('history-dots');
            if (!results) return;
            container.innerHTML = '';
            // Отрисовываем 5 штук, от старых к новым слева направо
            [...results].reverse().forEach(res => {
                const dot = document.createElement('div');
                dot.className = `dot ${res === 'W' ? 'win' : 'loss'}`;
                container.appendChild(dot);
            });
        }

        // Инициализация
        updateStats();
        setInterval(updateStats, CONFIG.updateInterval * 1000);
    </script>
</body>

</html>
